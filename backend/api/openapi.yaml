openapi: 3.1.0
info:
  title: DataDock Backend API
  version: 1.0.0
  description: |
    Protected routes use the session cookie from `POST /auth/login`. Mutating
    requests require the configured origin. The API omits connection credentials
    from responses. MySQL and MariaDB migrations reject implicit-commit statements.
servers:
  - url: /
    description: Same-origin deployment
tags:
  - name: Authentication
  - name: Connections
  - name: Catalog
  - name: Query
  - name: Migrations
  - name: Access administration
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Start an authenticated session
      description: |
        Accepts URL-encoded credentials, validates them, and sets the HttpOnly
        `session_id` cookie. The endpoint rejects query parameters and
        cross-origin requests. The cookie is Secure in HTTPS deployments.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        "204":
          description: Login succeeded; session cookie set.
          headers:
            Set-Cookie:
              description: HttpOnly session cookie.
              schema:
                type: string
        "400":
          description: Invalid form, query parameters, cookie, or origin.
        "401":
          description: Invalid username or password.
        "413":
          description: Request body exceeds 8 KiB.
        "415":
          description: Content-Type must be application/x-www-form-urlencoded.
        "503":
          description: Authentication or session service unavailable.
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: End the current session
      description: Requires an empty URL-encoded form; query parameters and cross-origin requests are rejected.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              maxProperties: 0
      responses:
        "204":
          description: Session ended; session cookie cleared.
          headers:
            Set-Cookie:
              description: Expired session cookie.
              schema:
                type: string
        "400":
          description: Invalid form, session cookie, query parameters, or origin.
        "413":
          description: Request body exceeds 8 KiB.
        "415":
          description: Content-Type must be application/x-www-form-urlencoded.
        "503":
          description: Logout service unavailable.
  /auth/session:
    get:
      tags: [Authentication]
      operationId: getSessionStatus
      summary: Check whether the session is valid
      responses:
        "204":
          description: Session is valid.
        "401":
          description: Session is missing or invalid.
        "503":
          description: Session service unavailable.
  /auth/admin-session:
    get:
      tags: [Authentication]
      operationId: getAdminSessionStatus
      summary: Check whether the current session has admin permission
      responses:
        "204":
          description: Session is valid and has ManageConnections permission.
        "401":
          description: Session is missing or invalid.
        "403":
          description: User is not a platform admin.
        "503":
          description: Session or authorization service unavailable.

  /api/v1/connections:
    get:
      tags: [Connections]
      operationId: listConnections
      summary: List connections available to the current user
      description: Returns only connections for which the user has ReadSchema access. For the administrator's configuration list, use GET /api/v1/admin/connections. DSNs are omitted.
      responses:
        "200":
          description: Visible managed connections.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Could not load connection permissions.
    post:
      tags: [Connections]
      operationId: createConnection
      summary: Create and verify a managed connection
      description: Admin-only. Opens and pings the target before saving its encrypted DSN and returning safe connection metadata.
      security:
        - sessionCookie: []
      x-required-permission: ManageConnections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionCreate"
      responses:
        "201":
          description: Connection created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          description: Invalid request or target connection could not be created/verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/connections:
    get:
      tags: [Connections]
      operationId: listAdminConnections
      summary: List all connections for configuration management
      description: Lists connection settings across all databases. Database grants govern access to catalog, query, and migration data.
      security:
        - sessionCookie: []
      x-required-permission: ManageConnections
      responses:
        "200":
          description: All managed connection configuration metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/connections/{id}/migration-runs/{runID}/reconcile:
    post:
      tags: [Migrations]
      operationId: reconcileMigrationRun
      summary: Reconcile an unconfirmed PostgreSQL migration execution
      description: Marks an attempt as failed if SQL dispatch has not started. Otherwise, checks the original PostgreSQL transaction without rerunning migration SQL. Repeated requests return the saved status.
      security:
        - sessionCookie: []
      x-required-permission: ManageConnections
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - name: runID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Status of the existing execution.
          content:
            application/json:
              schema:
                type: object
                required: [execution_id, status]
                properties:
                  execution_id:
                    type: string
                  status:
                    type: string
                    enum: [SUCCEEDED, FAILED]
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The outcome is still unconfirmed and the connection remains reserved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/OperationFailed"

  /api/v1/connections/{id}:
    parameters:
      - $ref: "#/components/parameters/ConnectionID"
    get:
      tags: [Connections]
      operationId: getConnection
      summary: Get safe connection metadata
      x-required-permission: ReadSchema
      responses:
        "200":
          description: Connection metadata; DSN is not returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Connections]
      operationId: updateConnection
      summary: Update connection pool settings
      description: Admin-only. Updates only max open connections, max idle connections, maximum connection lifetime, and maximum idle time. The target database, credentials, and driver cannot be changed through this endpoint.
      x-required-permission: ManageConnections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionUpdate"
      responses:
        "200":
          description: Updated connection metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "400":
          description: Invalid pool settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Could not save connection settings.
    delete:
      tags: [Connections]
      operationId: deleteConnection
      summary: Delete a managed connection
      description: Admin-only. Deletes its saved settings and closes its runtime pool.
      x-required-permission: ManageConnections
      responses:
        "204":
          description: Connection deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/OperationFailed"
  /api/v1/connections/{id}/settings:
    get:
      tags: [Connections]
      operationId: getConnectionSettings
      summary: Get connection settings metadata
      description: Admin-only. Returns the same safe public connection view; the DSN is never returned.
      x-required-permission: ManageConnections
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: Safe connection metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/connections/{id}/test:
    post:
      tags: [Connections]
      operationId: testConnection
      summary: Ping a managed database
      x-required-permission: ReadSchema
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: Ping succeeded.
          content:
            application/json:
              schema:
                type: object
                required: [ok, latencyMs]
                properties:
                  ok:
                    type: boolean
                    const: true
                  latencyMs:
                    type: number
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "502":
          description: Database ping failed.
  /api/v1/connections/{id}/connect:
    post:
      tags: [Connections]
      operationId: connectConnection
      summary: Connect a disconnected managed database
      description: Admin-only. Opens and pings a pool using the saved configuration.
      x-required-permission: ManageConnections
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: Connection is active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Connection"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/OperationFailed"
  /api/v1/connections/{id}/disconnect:
    post:
      tags: [Connections]
      operationId: disconnectConnection
      summary: Disconnect a managed database
      description: Admin-only. Closes the runtime pool but retains saved settings.
      x-required-permission: ManageConnections
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "204":
          description: Connection disconnected.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/OperationFailed"

  /api/v1/connections/{id}/schemas:
    get:
      tags: [Catalog]
      operationId: listSchemas
      summary: List database schemas
      x-required-permission: ReadSchema
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      responses:
        "200":
          description: Schemas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schema"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/OperationFailed"
  /api/v1/connections/{id}/schemas/{schema}/tables:
    get:
      tags: [Catalog]
      operationId: listTables
      summary: List tables in a schema
      x-required-permission: ReadSchema
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/SchemaName"
      responses:
        "200":
          description: Tables.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Table"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/OperationFailed"
  /api/v1/connections/{id}/schemas/{schema}/tables/{table}:
    get:
      tags: [Catalog]
      operationId: getTable
      summary: Get table metadata
      x-required-permission: ReadSchema
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/SchemaName"
        - $ref: "#/components/parameters/TableName"
      responses:
        "200":
          description: Table metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Table"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/OperationFailed"
  /api/v1/connections/{id}/schemas/{schema}/tables/{table}/columns:
    get:
      tags: [Catalog]
      operationId: listTableColumns
      summary: List table columns
      x-required-permission: ReadSchema
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/SchemaName"
        - $ref: "#/components/parameters/TableName"
      responses:
        "200":
          description: Table columns.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Column"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/OperationFailed"
  /api/v1/connections/{id}/schemas/{schema}/tables/{table}/constraints:
    get:
      tags: [Catalog]
      operationId: listTableConstraints
      summary: List table constraints
      x-required-permission: ReadSchema
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/SchemaName"
        - $ref: "#/components/parameters/TableName"
      responses:
        "200":
          description: Table constraints.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Constraint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/OperationFailed"
  /api/v1/connections/{id}/schemas/{schema}/tables/{table}/indexes:
    get:
      tags: [Catalog]
      operationId: listTableIndexes
      summary: List table indexes
      x-required-permission: ReadSchema
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/SchemaName"
        - $ref: "#/components/parameters/TableName"
      responses:
        "200":
          description: Table indexes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Index"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/OperationFailed"
  /api/v1/connections/{id}/schemas/{schema}/tables/{table}/rows:
    get:
      tags: [Catalog]
      operationId: listTableRows
      summary: Read a page of table rows
      x-required-permission: ReadData
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/SchemaName"
        - $ref: "#/components/parameters/TableName"
        - name: limit
          in: query
          description: Page size, default 50, maximum 500.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: column
          in: query
          description: Columns to return; may be supplied multiple times.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: sort
          in: query
          schema:
            type: string
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
        - name: "filter.{column}"
          in: query
          description: Filter by a column; use the column name in place of {column}.
          schema:
            type: string
      responses:
        "200":
          description: Rows and paging metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RowsPage"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/OperationFailed"
  /api/v1/connections/{id}/query:
    post:
      tags: [Query]
      operationId: executeReadQuery
      summary: Execute a read-only SELECT query
      description: Only a single SELECT is accepted. Query execution has a 15-second timeout and a maximum/default result limit of 500/50.
      x-required-permission: ReadData
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Query result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/OperationFailed"

  /api/v1/connections/{id}/migrations:
    parameters:
      - $ref: "#/components/parameters/ConnectionID"
    get:
      tags: [Migrations]
      operationId: listMigrations
      summary: List migrations for a connection
      x-required-permission: ReadMigration
      responses:
        "200":
          description: Migrations.
          content:
            application/json:
              schema:
                type: object
                required: [database_id, migrations, can_submit]
                properties:
                  database_id:
                    type: string
                  can_submit:
                    type: boolean
                    description: Whether the caller can submit a migration request for this database.
                  migrations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Migration"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/OperationFailed"
    post:
      tags: [Migrations]
      operationId: createMigration
      summary: Create a migration draft
      x-required-permission: CreateMigration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/MigrationDefinitionInput"
                - required: [title]
      responses:
        "201":
          description: Draft created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Migration"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: The rollback definition is incomplete or SQL is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/OperationFailed"
  /api/v1/connections/{id}/migrations/history:
    parameters:
      - $ref: "#/components/parameters/ConnectionID"
    get:
      tags: [Migrations]
      operationId: listMigrationHistory
      summary: List all migration attempts for a connection
      description: Returns attempts in descending execution ID order, including failed and unfinished attempts.
      x-required-permission: ReadMigration
      responses:
        "200":
          description: Migration attempts for this connection.
          content:
            application/json:
              schema:
                type: object
                required: [database_id, runs]
                properties:
                  database_id:
                    type: string
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/MigrationHistoryEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/OperationFailed"
  /api/v1/connections/{id}/migrations/{migrationID}:
    parameters:
      - $ref: "#/components/parameters/ConnectionID"
      - $ref: "#/components/parameters/MigrationID"
    get:
      tags: [Migrations]
      operationId: getMigration
      summary: Get migration and execution history
      x-required-permission: ReadMigration
      responses:
        "200":
          description: Migration details and runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationDetail"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/OperationFailed"
    patch:
      tags: [Migrations]
      operationId: updateMigration
      summary: Update a draft migration
      description: Only drafts that have never been attempted can be edited.
      x-required-permission: UpdateMigration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrationDefinitionInput"
      responses:
        "200":
          description: Updated migration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Migration"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The revision changed or its definition has been frozen by an execution attempt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The rollback definition is incomplete or SQL is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/OperationFailed"
  /api/v1/connections/{id}/migrations/{migrationID}/requests:
    post:
      tags: [Migrations]
      operationId: submitMigrationRequest
      summary: Submit an operation for group leader review
      x-required-permission: ExecuteMigration
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/MigrationID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation, revision]
              properties:
                operation:
                  $ref: "#/components/schemas/MigrationRequestOperation"
                revision:
                  type: integer
                  format: int64
                  minimum: 1
      responses:
        "201":
          $ref: "#/components/responses/MigrationRequestCreated"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The requested revision or operation is no longer available, or the migration is irreversible.
  /api/v1/connections/{id}/migration-requests/{requestID}:
    get:
      tags: [Migrations]
      operationId: getMigrationRequest
      summary: Read a migration request and its required approvals
      x-required-permission: ReadMigration
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/MigrationRequestID"
      responses:
        "200":
          $ref: "#/components/responses/MigrationRequestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/connections/{id}/migration-requests/{requestID}/approvals/{groupID}:
    put:
      tags: [Migrations]
      operationId: approveMigrationRequest
      summary: Record approval from the current leader of a granted group
      description: The final required approval completes review. The requester initiates execution separately.
      x-required-permission: ReadMigration
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/MigrationRequestID"
        - $ref: "#/components/parameters/GroupID"
      responses:
        "200":
          $ref: "#/components/responses/MigrationRequestResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The reviewed revision or operation target changed, or the request was already queued.
  /api/v1/connections/{id}/migration-requests/{requestID}/execute:
    post:
      tags: [Migrations]
      operationId: enqueueMigrationRequest
      summary: Queue an approved migration request
      description: Only the requester can queue the approved operation. Repeated calls return the original job ID.
      x-required-permission: ExecuteMigration
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/MigrationRequestID"
      responses:
        "202":
          description: The migration job was accepted.
          content:
            application/json:
              schema:
                type: object
                required: [job_id]
                properties:
                  job_id:
                    type: string
                    format: uuid
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Approval is incomplete, or the reviewed revision or operation target changed.
  /api/v1/connections/{id}/migrations/{migrationID}/execute:
    post:
      tags: [Migrations]
      operationId: executeMigration
      summary: Enqueue a migration execution job
      description: Publishes an asynchronous execution job to the persistent queue and returns immediately with a job ID.
      x-required-permission: ExecuteMigration
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/MigrationID"
      responses:
        "202":
          description: Migration job accepted and enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueResult"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Conflict with current migration state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: SQL validation failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/OperationFailed"
  /api/v1/connections/{id}/migrations/{migrationID}/rollback:
    post:
      tags: [Migrations]
      operationId: rollbackMigration
      summary: Enqueue a migration rollback job
      x-required-permission: ExecuteMigration
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/MigrationID"
      responses:
        "202":
          description: Rollback job accepted and enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Migration order conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Migration is irreversible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/connections/{id}/migrations/{migrationID}/forward:
    post:
      tags: [Migrations]
      operationId: forwardMigration
      summary: Enqueue a migration forward job
      x-required-permission: ExecuteMigration
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - $ref: "#/components/parameters/MigrationID"
      responses:
        "202":
          description: Forward job accepted and enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Migration order conflict.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/connections/{id}/jobs:
    parameters:
      - $ref: "#/components/parameters/ConnectionID"
    get:
      tags: [Migrations]
      operationId: listJobs
      summary: List asynchronous migration jobs for a connection
      x-required-permission: ReadMigration
      responses:
        "200":
          description: Migration jobs for this connection.
          content:
            application/json:
              schema:
                type: object
                required: [database_id, jobs]
                properties:
                  database_id:
                    type: string
                  jobs:
                    type: array
                    items:
                      $ref: "#/components/schemas/MigrationJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/jobs/{jobID}:
    get:
      tags: [Migrations]
      operationId: getJob
      summary: Get asynchronous migration job status and progress
      x-required-permission: ReadMigration
      parameters:
        - name: jobID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current job state and batch progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationJob"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/connections/{id}/jobs/{jobID}/resume:
    post:
      tags: [Migrations]
      operationId: resumeBatchJob
      summary: Enqueue resume from checkpoint for a partial batch job
      x-required-permission: ExecuteMigration
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - name: jobID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Resume batch job accepted and enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Job is not in partial state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/connections/{id}/jobs/{jobID}/revert:
    post:
      tags: [Migrations]
      operationId: revertBatchJob
      summary: Enqueue compensating batch revert for a partial or partially reverted job
      x-required-permission: ExecuteMigration
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
        - name: jobID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Revert batch job accepted and enqueued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnqueueResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Job is not in partial or partially_reverted state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: Migration is irreversible.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/connections/{id}/migrations/explain:
    post:
      tags: [Migrations]
      operationId: explainMigrationQuery
      summary: Explain a query
      description: Validates and explains the query in a transaction that is rolled back.
      x-required-permission: ExecuteMigration
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sql_content]
              properties:
                sql_content:
                  type: string
                analyze:
                  type: boolean
                  default: false
      responses:
        "200":
          description: Explain plan summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplainPlan"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          description: SQL is invalid or explain execution failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/OperationFailed"
  /api/v1/connections/{id}/migrations/schema-diff:
    post:
      tags: [Migrations]
      operationId: generateSchemaDiff
      summary: Compare current schema with a desired schema
      x-required-permission: ReadMigration
      parameters:
        - $ref: "#/components/parameters/ConnectionID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [desired_tables]
              properties:
                schema_name:
                  type: string
                desired_tables:
                  type: array
                  items:
                    $ref: "#/components/schemas/DesiredTable"
      responses:
        "200":
          description: Schema difference and candidate SQL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaDiff"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/OperationFailed"

  /api/v1/access/users:
    get:
      tags: [Access administration]
      operationId: listUsers
      summary: List users for group administration
      x-required-permission: ManageConnections
      responses:
        "200":
          description: Users with ID, username, and active status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: User store unavailable.
    post:
      tags: [Access administration]
      operationId: createUser
      summary: Create a user
      description: Admin-only. The password is hashed before persistence. Exactly one username and password field are accepted.
      x-required-permission: ManageConnections
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  minLength: 1
                  maxLength: 100
                password:
                  type: string
                  format: password
                  minLength: 1
                  maxLength: 1024
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid form or user input.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Username already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Form exceeds 8 KiB.
        "415":
          description: Content-Type must be application/x-www-form-urlencoded.
        "503":
          description: User store unavailable.
  /api/v1/access/groups:
    get:
      tags: [Access administration]
      operationId: listGroupsAndGrants
      summary: List groups, connection grants, and connection options
      x-required-permission: ManageConnections
      responses:
        "200":
          description: Groups and safe connection options for the admin UI.
          content:
            application/json:
              schema:
                type: object
                required: [groups, connections]
                properties:
                  groups:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccessGroup"
                  connections:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConnectionOption"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          description: Could not load group grants.
    post:
      tags: [Access administration]
      operationId: createGroup
      summary: Create an access group
      description: Creates the group and its initial membership atomically. The leader must be an active user included in memberIds.
      x-required-permission: ManageConnections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, memberIds, leaderId]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                memberIds:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: string
                    minLength: 1
                leaderId:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Group created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessGroup"
        "400":
          description: Invalid group name, membership, leader, or JSON body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Group name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Group store unavailable.
  /api/v1/access/groups/{groupID}/leader:
    put:
      tags: [Access administration]
      operationId: setGroupLeader
      summary: Set the leader of an access group
      description: The proposed leader must already be an active member of this group.
      x-required-permission: ManageConnections
      parameters:
        - $ref: "#/components/parameters/GroupID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaderId]
              properties:
                leaderId:
                  type: string
                  minLength: 1
      responses:
        "204":
          description: Group leader set.
        "400":
          description: Invalid JSON or leader is not an active member of the group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Membership store unavailable.
  /api/v1/access/groups/{groupID}/members:
    get:
      tags: [Access administration]
      operationId: listGroupMembers
      summary: List users and membership state for a group
      x-required-permission: ManageConnections
      parameters:
        - $ref: "#/components/parameters/GroupID"
      responses:
        "200":
          description: Group members and non-members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMember"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Membership store unavailable.
  /api/v1/access/groups/{groupID}/members/{userID}:
    parameters:
      - $ref: "#/components/parameters/GroupID"
      - $ref: "#/components/parameters/UserID"
    put:
      tags: [Access administration]
      operationId: addGroupMember
      summary: Add a user to a group
      x-required-permission: ManageConnections
      responses:
        "204":
          description: Membership added.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Membership store unavailable.
    delete:
      tags: [Access administration]
      operationId: removeGroupMember
      summary: Remove a user from a group
      x-required-permission: ManageConnections
      responses:
        "204":
          description: Membership removed.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The current leader cannot be removed until another leader is appointed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Membership store unavailable.
  /api/v1/access/groups/{groupID}/connections/{connectionID}:
    parameters:
      - $ref: "#/components/parameters/GroupID"
      - name: connectionID
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Access administration]
      operationId: setGroupConnectionAccess
      summary: Grant a group read or write access to a connection
      x-required-permission: ManageConnections
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access]
              properties:
                access:
                  type: string
                  enum: [read, write]
      responses:
        "204":
          description: Grant saved.
        "400":
          description: Access must be read or write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Access store unavailable.
    delete:
      tags: [Access administration]
      operationId: deleteGroupConnectionAccess
      summary: Remove a group's connection grant
      x-required-permission: ManageConnections
      responses:
        "204":
          description: Grant removed.
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Access store unavailable.

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: session_id
      description: HttpOnly session cookie set by POST /auth/login.
  parameters:
    ConnectionID:
      name: id
      in: path
      required: true
      schema:
        type: string
    SchemaName:
      name: schema
      in: path
      required: true
      schema:
        type: string
    TableName:
      name: table
      in: path
      required: true
      schema:
        type: string
    MigrationID:
      name: migrationID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    MigrationRequestID:
      name: requestID
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    GroupID:
      name: groupID
      in: path
      required: true
      schema:
        type: string
    UserID:
      name: userID
      in: path
      required: true
      schema:
        type: string
  responses:
    MigrationRequestCreated:
      description: Migration request saved for review.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MigrationRequest"
    MigrationRequestResult:
      description: Migration request and current approval status.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MigrationRequest"
    Unauthorized:
      description: Missing or invalid session.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
        text/plain:
          schema:
            type: string
    Forbidden:
      description: Authenticated user lacks the required permission.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
        text/plain:
          schema:
            type: string
    NotFound:
      description: Connection or database object not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InvalidRequest:
      description: Request body, query, or path parameter is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OperationFailed:
      description: Operation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    PoolConfig:
      type: object
      properties:
        maxOpen:
          type: integer
          minimum: 0
        maxIdle:
          type: integer
          minimum: 0
        maxLifetimeSeconds:
          type: integer
          minimum: 0
        maxIdleTimeSeconds:
          type: integer
          minimum: 0
    PoolStats:
      type: object
      properties:
        MaxOpenConnections:
          type: integer
        OpenConnections:
          type: integer
        InUse:
          type: integer
        Idle:
          type: integer
        WaitCount:
          type: integer
          format: int64
        WaitDuration:
          type: integer
          format: int64
        MaxIdleClosed:
          type: integer
          format: int64
        MaxIdleTimeClosed:
          type: integer
          format: int64
        MaxLifetimeClosed:
          type: integer
          format: int64
    Connection:
      type: object
      required: [id, name, driver, connected, createdAt, pool, poolStats]
      properties:
        id:
          type: string
        name:
          type: string
        driver:
          type: string
          enum: [postgres, mysql, mariadb]
        connected:
          type: boolean
        createdAt:
          type: string
          format: date-time
        pool:
          $ref: "#/components/schemas/PoolConfig"
        poolStats:
          $ref: "#/components/schemas/PoolStats"
      description: Public connection representation. DSN and credentials are intentionally omitted.
    ConnectionCreate:
      type: object
      required: [name, driver, dsn]
      properties:
        name:
          type: string
        driver:
          type: string
          enum: [postgres, postgresql, pgx, mysql, mariadb, maria]
        dsn:
          type: string
          writeOnly: true
          description: Target database connection string. Never returned by the API.
        pool:
          $ref: "#/components/schemas/PoolConfig"
    ConnectionUpdate:
      type: object
      additionalProperties: false
      required: [pool]
      properties:
        pool:
          $ref: "#/components/schemas/ConnectionPoolUpdate"
    ConnectionPoolUpdate:
      type: object
      additionalProperties: false
      required: [maxOpen, maxIdle, maxLifetimeSeconds, maxIdleTimeSeconds]
      properties:
        maxOpen:
          type: integer
          minimum: 0
        maxIdle:
          type: integer
          minimum: 0
        maxLifetimeSeconds:
          type: integer
          minimum: 0
        maxIdleTimeSeconds:
          type: integer
          minimum: 0
    ConnectionOption:
      type: object
      required: [id, name, driver]
      properties:
        id:
          type: string
        name:
          type: string
        driver:
          type: string
    Schema:
      type: object
      required: [name]
      properties:
        name:
          type: string
    Table:
      type: object
      required: [schema, name, type]
      properties:
        schema:
          type: string
        name:
          type: string
        type:
          type: string
    Column:
      type: object
      required: [name, position, type, nullable, ordinal]
      properties:
        name:
          type: string
        position:
          type: integer
        type:
          type: string
        nullable:
          type: boolean
        default:
          description: Database-specific default value.
        ordinal:
          type: integer
    Constraint:
      type: object
      required: [name, type, columns]
      properties:
        name:
          type: string
        type:
          type: string
        columns:
          type: array
          items:
            type: string
        definition:
          type: string
    Index:
      type: object
      required: [name, unique, columns]
      properties:
        name:
          type: string
        unique:
          type: boolean
        method:
          type: string
        columns:
          type: array
          items:
            type: string
    RowsPage:
      type: object
      required: [columns, rows, limit, offset]
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items: {}
        limit:
          type: integer
        offset:
          type: integer
    QueryRequest:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
          description: One read-only SELECT statement.
        args:
          type: array
          items: {}
        limit:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
    QueryResult:
      type: object
      required: [columns, rows]
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items: {}
    MigrationRequestOperation:
      type: string
      enum: [APPLY, ROLLBACK, FORWARD]
    MigrationRequest:
      type: object
      required: [id, migration_id, database_id, operation, revision, sql_snapshot, requested_by, created_at, status, reviews, viewer_id, can_execute]
      properties:
        id:
          type: integer
          format: int64
        migration_id:
          type: integer
          format: int64
        database_id:
          type: string
        operation:
          $ref: "#/components/schemas/MigrationRequestOperation"
        revision:
          type: integer
          format: int64
        target_run_id:
          type: integer
          format: int64
        sql_snapshot:
          type: string
        requested_by:
          type: string
        viewer_id:
          type: string
          description: ID of the authenticated user reading this request.
        can_execute:
          type: boolean
          description: Whether the caller is the requester with ViewEdit and the request is approved.
        created_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [PENDING_REVIEW, APPROVED, QUEUED, STALE]
        job_id:
          type: string
          format: uuid
        reviews:
          type: array
          items:
            type: object
            required: [group_id, group_name]
            properties:
              group_id:
                type: string
              group_name:
                type: string
              leader_id:
                type: string
              approved_at:
                type: string
                format: date-time
    MigrationDefinitionInput:
      type: object
      required: [sql_content]
      properties:
        title:
          type: string
        description:
          type: string
        sql_content:
          type: string
          description: SQL up.
        sql_down:
          type: string
          description: SQL that reverses SQL up.
        irreversible_reason:
          type: string
          description: Why the migration cannot be rolled back.
        execution_mode:
          type: string
          enum: [normal, batch]
          default: normal
        batch_by_attribute:
          type: string
        batch_size:
          type: integer
          minimum: 1
      oneOf:
        - required: [sql_down]
          properties:
            sql_down:
              pattern: '\S'
        - required: [irreversible_reason]
          properties:
            irreversible_reason:
              pattern: '\S'
    Migration:
      type: object
      required: [id, database_id, title, description, sql_content, revision, status, created_by, updated_by, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        database_id:
          type: string
        version:
          type: [integer, "null"]
          format: int64
        title:
          type: string
        description:
          type: string
        sql_content:
          type: string
          description: SQL up.
        sql_down:
          type: string
        irreversible_reason:
          type: string
        execution_mode:
          type: string
          enum: [normal, batch]
        batch_by_attribute:
          type: string
        batch_size:
          type: [integer, "null"]
        revision:
          type: integer
          format: int64
          minimum: 1
        frozen_at:
          type: string
          format: date-time
          description: When the first execution attempt froze this revision.
        status:
          type: string
          enum: [DRAFT, FAILED, APPLIED]
          description: APPLIED means the migration has a version. Its latest successful execution determines whether that version is active.
        created_by:
          type: string
        updated_by:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        applied_at:
          type: [string, "null"]
          format: date-time
    MigrationRun:
      type: object
      required: [id, migration_id, database_id, attempt_number, revision, operation, sql_snapshot, sql_dispatch_started, status, executed_by, execution_ms, started_at]
      properties:
        id:
          type: integer
          format: int64
        migration_id:
          type: integer
          format: int64
        database_id:
          type: string
        attempt_number:
          type: integer
        revision:
          type: integer
          format: int64
          minimum: 1
        operation:
          type: string
          enum: [APPLY, ROLLBACK, FORWARD]
        rollback_target_run_id:
          type: integer
          format: int64
          description: Execution targeted by a rollback attempt. The target is reverted only if the rollback succeeds.
        sql_snapshot:
          type: string
          description: SQL selected for the attempt.
        sql_dispatch_started:
          type: [boolean, "null"]
          description: True when the executor reached the dispatch step, false before that step, and null for older attempts without dispatch tracking.
        status:
          type: string
          enum: [RUNNING, SUCCEEDED, FAILED]
          description: A run remains RUNNING if its outcome has not yet been verified.
        executed_by:
          type: string
        error_message:
          type: [string, "null"]
        execution_ms:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        finished_at:
          type: [string, "null"]
          format: date-time
    MigrationHistoryEntry:
      type: object
      required: [id, migration_id, title, reversible, attempt_number, revision, operation, status, sql_snapshot, sql_dispatch_started, executed_by, username, started_at, execution_ms]
      properties:
        id:
          type: string
          description: Execution ID, encoded as decimal text to preserve its full precision.
        migration_id:
          type: string
        title:
          type: string
        reversible:
          type: boolean
        version:
          type: integer
          format: int64
          description: The version assigned by a successful apply or used by a rollback or forward attempt.
        attempt_number:
          type: integer
        revision:
          type: integer
          format: int64
        operation:
          type: string
          enum: [APPLY, ROLLBACK, FORWARD]
        rollback_target_run_id:
          type: string
          description: Execution targeted by the rollback as decimal text. Only a successful rollback reverts it.
        status:
          type: string
          enum: [RUNNING, SUCCEEDED, FAILED]
        sql_snapshot:
          type: string
          description: SQL selected for the attempt.
        sql_dispatch_started:
          type: [boolean, "null"]
          description: True when the executor reached the dispatch step, false before that step, and null for older attempts without dispatch tracking.
        executed_by:
          type: string
        username:
          type: string
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        execution_ms:
          type: integer
          format: int64
    MigrationDetail:
      type: object
      required: [migration, runs]
      properties:
        migration:
          $ref: "#/components/schemas/Migration"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/MigrationRun"
    ExecuteResult:
      type: object
