      properties:
        job_id:
          type: string
          format: uuid
        execution_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, running, success, failed, partial, partially_reverted, uncertain]
    MigrationJob:
      type: object
      required: [job_id, migration_id, execution_id, database_id, actor_id, actor_username, action, mode, status, last_committed_batch, committed_rows, attempt, max_retries, enqueued_at, updated_at]
      properties:
        job_id:
          type: string
          format: uuid
        migration_id:
          type: integer
          format: int64
        execution_id:
          type: string
          format: uuid
        parent_execution_id:
          type: string
          format: uuid
        database_id:
          type: string
        actor_id:
          type: string
        actor_username:
          type: string
        action:
          type: string
          enum: [execute, rollback, forward, resume_batch, revert_batch]
        mode:
          type: string
          enum: [normal, batch]
        status:
          type: string
          enum: [pending, running, success, failed, partial, partially_reverted, uncertain]
        batch_by_attribute:
          type: string
        batch_size:
          type: integer
        target_scope_max:
          type: string
        last_committed_batch:
          type: integer
        last_committed_cursor:
          type: string
        committed_rows:
          type: integer
          format: int64
        attempt:
          type: integer
        max_retries:
          type: integer
        next_retry_at:
          type: string
          format: date-time
        error_message:
          type: string
        sqlstate:
          type: string
        enqueued_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ExplainPlan:
