global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: datadock-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - app:8080
        labels:
          service: datadock-api

  - job_name: datadock-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker:9091
        labels:
          service: datadock-worker
