services:
  app:
    build: .
    environment:
      DATABASE_STORE_DSN: "${DATABASE_STORE_DSN:-postgres://${POSTGRES_USER:-hello_world}:${POSTGRES_PASSWORD:-local_dev_password}@db:5432/${POSTGRES_DB:-hello_world}?sslmode=disable}"
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY:-local-dev-connection-encryption-key-change-before-deployment}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      ALLOW_INSECURE_LOCAL_HTTP: ${ALLOW_INSECURE_LOCAL_HTTP:-true}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin-local-change-me}
      SEED_USER_USERNAME: ${SEED_USER_USERNAME:-user}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-user-local-change-me}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8080}
    environment:
      INTERNAL_API_BASE_URL: http://app:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-80}:4321"
    depends_on:
      - app

  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hello_world}
      POSTGRES_USER: ${POSTGRES_USER:-hello_world}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - platform_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hello_world} -d ${POSTGRES_DB:-hello_world}"]
      interval: 3s
      timeout: 3s
      retries: 20

  db_example:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${EXAMPLE_POSTGRES_DB:-example_db}
      POSTGRES_USER: ${EXAMPLE_POSTGRES_USER:-example_user}
      POSTGRES_PASSWORD: ${EXAMPLE_POSTGRES_PASSWORD:-example_local_password}
    ports:
      - "127.0.0.1:${EXAMPLE_DB_PORT:-5434}:5432"
    volumes:
      - example_data:/var/lib/postgresql
      - ./db_example/data.sql:/docker-entrypoint-initdb.d/001-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EXAMPLE_POSTGRES_USER:-example_user} -d ${EXAMPLE_POSTGRES_DB:-example_db}"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  platform_data:
  example_data:
