services:
  app:
    build: .
    environment:
      DATABASE_STORE_DSN: "${DATABASE_STORE_DSN:-postgres://${POSTGRES_USER:-hello_world}:${POSTGRES_PASSWORD:-local_dev_password}@db:5432/${POSTGRES_DB:-hello_world}?sslmode=disable}"
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY:-local-dev-connection-encryption-key-change-before-deployment}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      ALLOW_INSECURE_LOCAL_HTTP: ${ALLOW_INSECURE_LOCAL_HTTP:-true}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:-MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-admin-local-change-me}
      SEED_USER_USERNAME: ${SEED_USER_USERNAME:-user}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-user-local-change-me}
      OTEL_EXPORTER: ${OTEL_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_SERVICE_NAME: datadock-api
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started

  worker:
    build: .
    command: ["/app/worker"]
    restart: unless-stopped
    environment:
      DATABASE_STORE_DSN: "${DATABASE_STORE_DSN:-postgres://${POSTGRES_USER:-hello_world}:${POSTGRES_PASSWORD:-local_dev_password}@db:5432/${POSTGRES_DB:-hello_world}?sslmode=disable}"
      DATABASE_ENCRYPTION_KEY: ${DATABASE_ENCRYPTION_KEY:-local-dev-connection-encryption-key-change-before-deployment}
      OTEL_EXPORTER: ${OTEL_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4317}
      OTEL_SERVICE_NAME: datadock-worker
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_METRICS_ADDR: ${WORKER_METRICS_ADDR:-:9091}
      LOCK_LEASE_SECONDS: ${LOCK_LEASE_SECONDS:-15}
      LOCK_HEARTBEAT_SECONDS: ${LOCK_HEARTBEAT_SECONDS:-5}
    ports:
      - "127.0.0.1:${WORKER_METRICS_PORT:-9091}:9091"
    depends_on:
      db:
        condition: service_healthy
      otel-collector:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      INTERNAL_API_BASE_URL: http://app:8080
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-80}:3000"
    depends_on:
      - app

  db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hello_world}
      POSTGRES_USER: ${POSTGRES_USER:-hello_world}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_password}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - platform_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hello_world} -d ${POSTGRES_DB:-hello_world}"]
      interval: 3s
      timeout: 3s
      retries: 20

  db_example:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${EXAMPLE_POSTGRES_DB:-example_db}
      POSTGRES_USER: ${EXAMPLE_POSTGRES_USER:-example_user}
      POSTGRES_PASSWORD: ${EXAMPLE_POSTGRES_PASSWORD:-example_local_password}
    ports:
      - "127.0.0.1:${EXAMPLE_DB_PORT:-5434}:5432"
    volumes:
      - example_data:/var/lib/postgresql
      - ./db_example/data.sql:/docker-entrypoint-initdb.d/001-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EXAMPLE_POSTGRES_USER:-example_user} -d ${EXAMPLE_POSTGRES_DB:-example_db}"]
      interval: 5s
      timeout: 3s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - loki
      - tempo

  loki:
    image: grafana/loki:3.3.2
    user: "0:0"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/tmp/loki
    ports:
      - "127.0.0.1:3100:3100"

  tempo:
    image: grafana/tempo:2.7.1
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo-config.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  prometheus:
    image: prom/prometheus:v3.2.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - app
      - worker

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  k6:
    image: grafana/k6:0.56.0
    profiles: ["stress"]
    user: "0:0"
    environment:
      BASE_URL: ${K6_BASE_URL:-http://app:8080}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost}
      FIXTURES_PATH: /scripts/fixtures/stress-fixtures.json
      SUMMARY_DIR: /scripts/results
    volumes:
      - ./k6:/scripts
    command: ["run", "/scripts/stress-test.js"]
    depends_on:
      - app
      - worker

volumes:
  platform_data:
  example_data:
  loki_data:
  tempo_data:
  prometheus_data:
  grafana_data:
